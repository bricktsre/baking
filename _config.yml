# Site Settings
title: "Baking"
description: >- # this means to ignore newlines until "baseurl:"
  Recipes and Thoughts on Baking
domain: bricktsre.github.io
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://bricktsre.github.io/baking"
github_username:  bricktsre

# GitHub Pages Settings
lsi: false
safe: true
#source: baking
incremental: false
highlighter: rouge
gist:
  noscript: false
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge

# Build settings
theme: minima
minima:
  skin: auto
#remote_theme: pages-themes/tactile@v0.2.0
plugins:
  - jekyll-feed
  - jekyll-remote-theme

# Collections
collections_dir: collections

collections:
  drop-cookies:
    output: true
    permalink: /drop-cookies/:path/

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
